# xremap の設定。
#
# ★ このファイルは install.sh を実行するたびに上書きされる。
#    自分のリマップは同じディレクトリの config.local.yml に書くこと
#    (そちらは上書きされない。内容はこのファイルに追加される)。
#
# 設定の書き方: https://github.com/xremap/xremap
#
# ターミナル (Ghostty / Ptyxis) はグローバルなリマップから除外している。
# ターミナル内の Mac 風コピペは Ghostty のネイティブ keybind
# (~/.config/ghostty/config の alt+c / alt+v) が担当する。
#
# application の値は Wayland では GNOME 拡張が返す WM_CLASS。
# 実際の値は Alt+F2 → lg → Windows タブで確認できる。

modmap:
  - name: CapsLock to Ctrl
    remap:
      CapsLock: Ctrl_L

keymap:
  - name: Global Mac Bindings (Except Terminals)
    application:
      not: [com.mitchellh.ghostty, org.gnome.Ptyxis]
    remap:
      # Mac の Command 相当を Alt に割り当てる
      Alt-c: Ctrl-c
      Alt-v: Ctrl-v
      Alt-x: Ctrl-x
      Alt-z: Ctrl-z
      Alt-a: Ctrl-a
      Alt-s: Ctrl-s
      Alt-f: Ctrl-f
      Alt-t: Ctrl-t
      Alt-w: Ctrl-w
      # Cmd+Q 相当。GNOME には「アプリ全体を終了」の統一アクションがないため、
      # 全アプリで確実に効く Alt-F4 (GNOME の close) に変換する。
      # 複数ウィンドウを開いているアプリでは手前の 1 窓だけが閉じる。
      Alt-q: Alt-F4
      # Emacs 風のカーソル移動
      Ctrl-p: Up
      Ctrl-n: Down
      Ctrl-b: Left
      Ctrl-f: Right
      Ctrl-a: Home
      Ctrl-e: End
      Ctrl-h: BackSpace
      Ctrl-d: Delete
      Ctrl-k: [Shift-End, BackSpace]
